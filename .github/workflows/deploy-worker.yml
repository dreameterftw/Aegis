name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "Aegis/worker/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: Aegis/worker
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: Aegis/worker

      - name: Upload secrets
        working-directory: Aegis/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON
          echo "${{ secrets.GROQ_API_KEY }}" | npx wrangler secret put GROQ_API_KEY
          echo "${{ secrets.VIRUSTOTAL_API_KEY }}" | npx wrangler secret put VIRUSTOTAL_API_KEY
